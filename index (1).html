<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Bella Tavola | Restaurant Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-dark:#2b1d16; --brand-gold:#f0a500; --brand-cream:#fff8ee; }
    body { font-family:"Poppins",sans-serif; background:var(--brand-cream); color:#333; }
    h1,h2,h3,h4,.brand,.section-title { font-family:"Playfair Display",serif; }

    .app-navbar { background:var(--brand-dark); }
    .app-navbar .brand { font-size:1.5rem; color:var(--brand-gold); text-decoration:none; }
    .app-navbar .nav-link { color:#f5e9d8; margin:0 .25rem; }
    .app-navbar .nav-link:hover, .app-navbar .nav-link.active { color:var(--brand-gold); }

    .hero {
      min-height:85vh;
      background:
        linear-gradient(rgba(43,29,22,.65), rgba(43,29,22,.65)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat,
        var(--brand-dark);
    }
    .section-title { color:var(--brand-dark); padding-bottom:.75rem; }
    .section-title::after { content:""; display:block; width:70px; height:3px; background:var(--brand-gold); margin:.6rem auto 0; }
    .highlight-card { transition:transform .2s ease; }
    .highlight-card:hover { transform:translateY(-6px); }
    .highlight-icon { font-size:3rem; }
    .details-section { background:var(--brand-dark); color:#f5e9d8; }
    .details-section h5 { color:var(--brand-gold); }
    .about-image {
      height:340px; border-radius:1rem; box-shadow:0 8px 24px rgba(0,0,0,.15);
      background:url("https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=900&q=80") center/cover no-repeat, #c9a27a;
    }
    .page { min-height:70vh; }
    .auth-card { max-width:440px; }
    .app-footer { background:var(--brand-dark); color:#cdbba5; }

    .btn-warning { background:var(--brand-gold); border-color:var(--brand-gold); color:#2b1d16; }
    .btn-warning:hover { background:#d89300; border-color:#d89300; color:#2b1d16; }

    @media (max-width:576px) { .hero h1 { font-size:2.5rem; } .about-image { height:220px; } }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div id="navbar"></div>
  <main id="app" class="flex-grow-1"></main>

  <footer class="app-footer text-center py-4">
    <div class="container">
      <p class="mb-1">🍽️ La Bella Tavola · 12 Garden Road, Bareilly</p>
      <small>© <span id="year"></span> La Bella Tavola. All rights reserved.</small>
    </div>
  </footer>

  <!-- Edit reservation popup -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Reservation</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="editBody"></div>
      </div>
    </div>
  </div>

  <!-- Message popup (toast) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:2000">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script id="app-script">
    /* =====================================================
       Restaurant Reservation System (single-file version)
       Data is saved in the browser (localStorage), so no
       backend or database is needed to deploy this file.
       ===================================================== */

    // ---------- Small helpers ----------
    const DB = {
      get(key, fallback) {
        try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
        catch (e) { return fallback; }
      },
      set(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    };

    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    // Escape text so user input can never break the page
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    // Turn a password into a hash before saving it
    async function hashPassword(password) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(password));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
      }
      return btoa(unescape(encodeURIComponent(password))); // fallback for very old browsers
    }

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };

    const statusBadge = (s) => {
      const cls = { pending: "bg-warning text-dark", confirmed: "bg-success", cancelled: "bg-danger" }[s];
      return `<span class="badge ${cls} text-capitalize">${s}</span>`;
    };

    function toast(message, type = "success") {
      const el = document.getElementById("toast");
      el.className = `toast align-items-center text-white border-0 bg-${type}`;
      document.getElementById("toastBody").textContent = message;
      bootstrap.Toast.getOrCreateInstance(el, { delay: 3000 }).show();
    }

    // ---------- Data (our "database") ----------
    const getUsers = () => DB.get("rr_users", []);
    const saveUsers = (u) => DB.set("rr_users", u);
    const getReservations = () => DB.get("rr_reservations", []);
    const saveReservations = (r) => DB.set("rr_reservations", r);
    const getSession = () => DB.get("rr_session", null);

    const sortReservations = (list) =>
      [...list].sort((a, b) => (a.bookingDate + a.bookingTime).localeCompare(b.bookingDate + b.bookingTime));

    // Create the admin account the first time the site opens
    async function ensureAdmin() {
      const users = getUsers();
      if (!users.some((u) => u.role === "admin")) {
        users.push({
          id: uid(),
          name: "Admin",
          email: "admin@restaurant.com",
          password: await hashPassword("admin123"),
          role: "admin"
        });
        saveUsers(users);
      }
    }

    // ---------- Navbar ----------
    function renderNav() {
      const page = currentPage();
      const user = getSession();
      const link = (hash, label) =>
        `<li class="nav-item"><a class="nav-link ${page === hash ? "active" : ""}" href="#/${hash}">${label}</a></li>`;

      document.getElementById("navbar").innerHTML = `
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top app-navbar">
          <div class="container">
            <a class="navbar-brand brand" href="#/home">🍽️ La Bella Tavola</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
              <ul class="navbar-nav ms-auto align-items-lg-center">
                ${link("home", "Home")}
                ${link("about", "About")}
                ${link("booking", "Booking")}
                ${link("contact", "Contact")}
                ${user && user.role === "admin" ? link("admin", "Admin Panel") : ""}
                ${user
                  ? `<li class="nav-item text-light mx-lg-3 my-2 my-lg-0 small">Hi, ${esc(user.name)}</li>
                     <li class="nav-item"><button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></li>`
                  : `<li class="nav-item d-flex gap-2 mt-2 mt-lg-0 ms-lg-3">
                       <a class="btn btn-outline-light btn-sm" href="#/login">Login</a>
                       <a class="btn btn-warning btn-sm" href="#/register">Register</a>
                     </li>`}
              </ul>
            </div>
          </div>
        </nav>`;
    }

    // ---------- Reservation form (used for new + edit) ----------
    function reservationFormHTML(id, d, label) {
      return `
        <form id="${id}">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Customer Name</label>
              <input class="form-control" name="customerName" value="${esc(d.customerName)}" placeholder="Your full name" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" value="${esc(d.email)}" placeholder="you@example.com" required />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" name="phone" value="${esc(d.phone)}" placeholder="10-digit mobile number"
                     pattern="[0-9+\\-\\s]{7,15}" title="Enter a valid phone number" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Number of Guests</label>
              <input type="number" class="form-control" name="guests" min="1" max="20" value="${esc(d.guests || 2)}" required />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Booking Date</label>
              <input type="date" class="form-control" name="bookingDate" min="${todayStr()}" value="${esc(d.bookingDate)}" required />
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Booking Time</label>
              <input type="time" class="form-control" name="bookingTime" min="11:00" max="23:00" value="${esc(d.bookingTime)}" required />
              <div class="form-text">We are open 11:00 AM – 11:00 PM</div>
            </div>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold">${label}</button>
        </form>`;
    }

    function readForm(form) {
      const f = new FormData(form);
      return {
        customerName: f.get("customerName").trim(),
        email: f.get("email").trim().toLowerCase(),
        phone: f.get("phone").trim(),
        bookingDate: f.get("bookingDate"),
        bookingTime: f.get("bookingTime"),
        guests: Number(f.get("guests"))
      };
    }

    // Returns an error message, or "" if everything is fine
    function validateReservation(d) {
      if (!d.customerName) return "Please enter the customer name.";
      if (d.guests < 1 || d.guests > 20) return "Guests must be between 1 and 20.";
      if (d.bookingDate < todayStr()) return "Please choose today or a future date.";
      if (d.bookingTime < "11:00" || d.bookingTime > "23:00") return "Booking time must be between 11:00 AM and 11:00 PM.";
      return "";
    }

    // ---------- Pages ----------
    const pages = {};
    let adminFilter = "all";
    let editTarget = null; // { id, admin }

    pages.home = () => {
      const items = [
        ["🍝", "Fresh Italian Food", "Hand-made pasta, wood-fired pizza and classic desserts made every day."],
        ["🕯️", "Cosy Ambience", "Warm lights, soft music and comfortable seating for family and friends."],
        ["⭐", "Friendly Service", "Our team makes sure every visit feels special, from first bite to last."]
      ];
      return `
        <section class="hero d-flex align-items-center text-center text-white">
          <div class="container">
            <h1 class="display-3 fw-bold">La Bella Tavola</h1>
            <p class="lead mb-4">Authentic flavours, warm hospitality. Reserve your table in less than a minute.</p>
            <a href="#/booking" class="btn btn-warning btn-lg fw-semibold px-4">Book a Table</a>
          </div>
        </section>
        <div class="container py-5">
          <h2 class="section-title text-center mb-5">Why Dine With Us</h2>
          <div class="row g-4">
            ${items.map((i) => `
              <div class="col-md-4">
                <div class="card h-100 text-center shadow-sm border-0 highlight-card">
                  <div class="card-body p-4">
                    <div class="highlight-icon">${i[0]}</div>
                    <h5 class="card-title mt-3">${i[1]}</h5>
                    <p class="card-text text-muted">${i[2]}</p>
                  </div>
                </div>
              </div>`).join("")}
          </div>
        </div>
        <section class="details-section py-5">
          <div class="container">
            <div class="row g-4 text-center">
              <div class="col-md-4"><h5>📍 Address</h5><p class="mb-0">12 Garden Road, Civil Lines<br>Bareilly, Uttar Pradesh</p></div>
              <div class="col-md-4"><h5>🕐 Opening Hours</h5><p class="mb-0">Monday – Sunday<br>11:00 AM – 11:00 PM</p></div>
              <div class="col-md-4"><h5>📞 Contact</h5><p class="mb-0">+91 98765 43210<br>hello@labellatavola.com</p></div>
            </div>
          </div>
        </section>`;
    };

    pages.about = () => `
      <div class="container page py-5">
        <h2 class="section-title text-center mb-4">About Us</h2>
        <div class="row align-items-center g-4">
          <div class="col-md-6"><div class="about-image" role="img" aria-label="Restaurant dining area"></div></div>
          <div class="col-md-6">
            <h4>Our Story</h4>
            <p>La Bella Tavola started as a small family kitchen with one simple idea: good food brings people together.
               Today we serve the same recipes with the same love, in a welcoming space for every occasion.</p>
            <p>We use fresh, local ingredients and cook everything to order. Whether it is a quiet dinner for two,
               a birthday or a family get-together, we are happy to host you.</p>
            <h5 class="mt-4">What we offer</h5>
            <ul>
              <li>Italian and continental main courses</li>
              <li>Wood-fired pizzas and fresh pasta</li>
              <li>Vegetarian and vegan options</li>
              <li>Desserts and coffee</li>
            </ul>
          </div>
        </div>
      </div>`;

    pages.contact = () => `
      <div class="container page py-5">
        <h2 class="section-title text-center mb-4">Contact Us</h2>
        <div class="row g-4">
          <div class="col-md-5">
            <div class="card shadow-sm border-0 h-100"><div class="card-body p-4">
              <h5>Get in touch</h5>
              <p class="mt-3">📍 12 Garden Road, Civil Lines, Bareilly, Uttar Pradesh</p>
              <p>📞 +91 98765 43210</p>
              <p>✉️ hello@labellatavola.com</p>
              <p class="mb-0">🕐 Every day, 11:00 AM – 11:00 PM</p>
            </div></div>
          </div>
          <div class="col-md-7">
            <div class="card shadow-sm border-0"><div class="card-body p-4">
              <h5>Send us a message</h5>
              <form id="contactForm">
                <div class="mb-3"><label class="form-label">Name</label><input class="form-control" required placeholder="Your name" /></div>
                <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required placeholder="you@example.com" /></div>
                <div class="mb-3"><label class="form-label">Message</label><textarea class="form-control" rows="4" required placeholder="How can we help?"></textarea></div>
                <button class="btn btn-warning fw-semibold" type="submit">Send Message</button>
              </form>
            </div></div>
          </div>
        </div>
      </div>`;

    pages.register = () => `
      <div class="container page py-5 d-flex justify-content-center">
        <div class="card auth-card shadow border-0 w-100"><div class="card-body p-4">
          <h3 class="text-center mb-4">Create Account</h3>
          <div id="formError"></div>
          <form id="registerForm">
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" placeholder="Your name" required /></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" placeholder="you@example.com" required /></div>
            <div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control" name="password" placeholder="At least 6 characters" minlength="6" required /></div>
            <button class="btn btn-warning w-100 fw-semibold" type="submit">Register</button>
          </form>
          <p class="text-center mt-3 mb-0">Already have an account? <a href="#/login">Login</a></p>
        </div></div>
      </div>`;

    pages.login = () => `
      <div class="container page py-5 d-flex justify-content-center">
        <div class="card auth-card shadow border-0 w-100"><div class="card-body p-4">
          <h3 class="text-center mb-4">Welcome Back</h3>
          <div id="formError"></div>
          <form id="loginForm">
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="email" placeholder="you@example.com" required /></div>
            <div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control" name="password" placeholder="Your password" required /></div>
            <button class="btn btn-warning w-100 fw-semibold" type="submit">Login</button>
          </form>
          <p class="text-center mt-3 mb-0">New here? <a href="#/register">Create an account</a></p>
        </div></div>
      </div>`;

    pages.booking = () => {
      const user = getSession();
      if (!user) {
        return `
          <div class="container page py-5 text-center">
            <h2 class="section-title mb-3">Book a Table</h2>
            <div class="alert alert-info d-inline-block">
              Please <a href="#/login">login</a> or <a href="#/register">register</a> to book a table.
            </div>
          </div>`;
      }
      const mine = sortReservations(getReservations().filter((r) => r.userId === user.id));
      return `
        <div class="container page py-5">
          <h2 class="section-title text-center mb-4">Book a Table</h2>
          <div class="row g-4">
            <div class="col-lg-5">
              <div class="card shadow-sm border-0"><div class="card-body p-4">
                <h5 class="mb-3">New Reservation</h5>
                ${reservationFormHTML("bookForm", { customerName: user.name, email: user.email }, "Book Table")}
              </div></div>
            </div>
            <div class="col-lg-7">
              <div class="card shadow-sm border-0"><div class="card-body p-4">
                <h5 class="mb-3">My Reservations</h5>
                ${mine.length === 0
                  ? `<p class="text-muted mb-0">You have no reservations yet.</p>`
                  : `<div class="table-responsive">
                      <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                          ${mine.map((r) => `
                            <tr>
                              <td>${esc(r.bookingDate)}</td>
                              <td>${esc(r.bookingTime)}</td>
                              <td>${r.guests}</td>
                              <td>${statusBadge(r.status)}</td>
                              <td class="text-nowrap">
                                <button class="btn btn-sm btn-outline-primary me-2" ${r.status === "cancelled" ? "disabled" : ""} onclick="openEdit('${r.id}', false)">Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteReservation('${r.id}')">Delete</button>
                              </td>
                            </tr>`).join("")}
                        </tbody>
                      </table>
                    </div>`}
              </div></div>
            </div>
          </div>
        </div>`;
    };

    pages.admin = () => {
      const all = sortReservations(getReservations());
      const count = (s) => all.filter((r) => r.status === s).length;
      const visible = adminFilter === "all" ? all : all.filter((r) => r.status === adminFilter);
      const stats = [
        ["Total", all.length, "dark"],
        ["Pending", count("pending"), "warning"],
        ["Confirmed", count("confirmed"), "success"],
        ["Cancelled", count("cancelled"), "danger"]
      ];
      return `
        <div class="container page py-5">
          <h2 class="section-title text-center mb-4">Admin Panel</h2>
          <div class="row g-3 mb-4 text-center">
            ${stats.map((s) => `
              <div class="col-6 col-md-3">
                <div class="card shadow-sm border-0"><div class="card-body">
                  <div class="fs-2 fw-bold text-${s[2]}">${s[1]}</div>
                  <div class="text-muted">${s[0]}</div>
                </div></div>
              </div>`).join("")}
          </div>
          <div class="card shadow-sm border-0"><div class="card-body p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
              <h5 class="mb-0">All Bookings</h5>
              <div class="btn-group btn-group-sm">
                ${["all", "pending", "confirmed", "cancelled"].map((f) => `
                  <button class="btn ${adminFilter === f ? "btn-dark" : "btn-outline-dark"} text-capitalize" onclick="setAdminFilter('${f}')">${f}</button>`).join("")}
              </div>
            </div>
            ${visible.length === 0
              ? `<p class="text-muted mb-0">No reservations found.</p>`
              : `<div class="table-responsive">
                  <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Customer</th><th>Contact</th><th>Date</th><th>Time</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                      ${visible.map((r) => `
                        <tr>
                          <td>${esc(r.customerName)}</td>
                          <td class="small">${esc(r.email)}<br>${esc(r.phone)}</td>
                          <td>${esc(r.bookingDate)}</td>
                          <td>${esc(r.bookingTime)}</td>
                          <td>${r.guests}</td>
                          <td>${statusBadge(r.status)}</td>
                          <td class="text-nowrap">
                            <button class="btn btn-sm btn-success me-1" ${r.status === "confirmed" ? "disabled" : ""} onclick="setStatus('${r.id}','confirmed')">Confirm</button>
                            <button class="btn btn-sm btn-secondary me-1" ${r.status === "cancelled" ? "disabled" : ""} onclick="setStatus('${r.id}','cancelled')">Cancel</button>
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEdit('${r.id}', true)">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteReservation('${r.id}')">Delete</button>
                          </td>
                        </tr>`).join("")}
                    </tbody>
                  </table>
                </div>`}
          </div></div>
        </div>`;
    };

    // ---------- Page events (forms) ----------
    function bindPageEvents(page) {
      if (page === "register") {
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          const name = f.get("name").trim();
          const email = f.get("email").trim().toLowerCase();
          const password = f.get("password");
          if (password.length < 6) return showFormError("Password must be at least 6 characters.");
          const users = getUsers();
          if (users.some((u) => u.email === email)) return showFormError("Email is already registered.");

          const user = { id: uid(), name, email, password: await hashPassword(password), role: "user" };
          users.push(user);
          saveUsers(users);
          startSession(user);
          toast("Account created. Welcome!");
          location.hash = "#/booking";
        });
      }

      if (page === "login") {
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          const email = f.get("email").trim().toLowerCase();
          const hashed = await hashPassword(f.get("password"));
          const user = getUsers().find((u) => u.email === email && u.password === hashed);
          if (!user) return showFormError("Invalid email or password.");
          startSession(user);
          toast(`Welcome back, ${user.name}!`);
          location.hash = user.role === "admin" ? "#/admin" : "#/booking";
        });
      }

      if (page === "contact") {
        document.getElementById("contactForm").addEventListener("submit", (e) => {
          e.preventDefault();
          e.target.reset();
          toast("Thank you! We will get back to you soon.");
        });
      }

      if (page === "booking" && getSession()) {
        document.getElementById("bookForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const data = readForm(e.target);
          const error = validateReservation(data);
          if (error) return toast(error, "danger");

          const user = getSession();
          const list = getReservations();
          list.push({ id: uid(), userId: user.id, ...data, status: "pending", createdAt: new Date().toISOString() });
          saveReservations(list);
          toast("Table booked! We will confirm it shortly.");
          render();
        });
      }
    }

    function showFormError(msg) {
      document.getElementById("formError").innerHTML = `<div class="alert alert-danger">${esc(msg)}</div>`;
    }

    // ---------- Actions ----------
    function startSession(user) {
      DB.set("rr_session", { id: user.id, name: user.name, email: user.email, role: user.role });
    }

    function logout() {
      localStorage.removeItem("rr_session");
      toast("You have been logged out.", "secondary");
      location.hash = "#/home";
      render();
    }

    function setAdminFilter(f) { adminFilter = f; render(); }

    function setStatus(id, status) {
      const user = getSession();
      if (!user || user.role !== "admin") return;
      const list = getReservations();
      const r = list.find((x) => x.id === id);
      if (!r) return;
      r.status = status;
      saveReservations(list);
      toast(`Reservation ${status}.`);
      render();
    }

    function deleteReservation(id) {
      const user = getSession();
      if (!user) return;
      const list = getReservations();
      const r = list.find((x) => x.id === id);
      if (!r) return;
      // Customers can delete only their own bookings, admins can delete any
      if (user.role !== "admin" && r.userId !== user.id) return;
      if (!confirm("Delete this reservation?")) return;
      saveReservations(list.filter((x) => x.id !== id));
      toast("Reservation deleted.");
      render();
    }

    function openEdit(id, admin) {
      const r = getReservations().find((x) => x.id === id);
      if (!r) return;
      editTarget = { id, admin };
      document.getElementById("editBody").innerHTML = reservationFormHTML("editForm", r, "Save Changes");
      document.getElementById("editForm").addEventListener("submit", saveEdit);
      bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).show();
    }

    function saveEdit(e) {
      e.preventDefault();
      const data = readForm(e.target);
      const error = validateReservation(data);
      if (error) return toast(error, "danger");

      const user = getSession();
      const list = getReservations();
      const r = list.find((x) => x.id === editTarget.id);
      if (!r || !user) return;
      if (user.role !== "admin" && r.userId !== user.id) return;

      Object.assign(r, data);
      // After a customer edits, the restaurant must confirm again
      if (!editTarget.admin) r.status = "pending";
      saveReservations(list);

      bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).hide();
      toast("Reservation updated.");
      render();
    }

    // ---------- Router ----------
    function currentPage() {
      const name = (location.hash.replace("#/", "") || "home").split("?")[0];
      return pages[name] ? name : "home";
    }

    let lastPage = null;
    function render() {
      let page = currentPage();
      const user = getSession();

      // Only admins may open the admin panel
      if (page === "admin" && (!user || user.role !== "admin")) {
        page = user ? "home" : "login";
        history.replaceState(null, "", "#/" + page);
      }

      renderNav();
      document.getElementById("app").innerHTML = pages[page]();
      bindPageEvents(page);
      if (page !== lastPage) window.scrollTo(0, 0);
      lastPage = page;
    }

    window.addEventListener("hashchange", render);

    (async function init() {
      document.getElementById("year").textContent = new Date().getFullYear();
      await ensureAdmin();
      render();
    })();
  </script>
</body>
</html>
